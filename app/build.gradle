plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

apply from: "native-audio.gradle"

def releaseKeystorePath = System.getenv("MP3_RELEASE_KEYSTORE")
def releaseKeyAlias = System.getenv("MP3_RELEASE_KEY_ALIAS")
def releaseStorePass = System.getenv("MP3_RELEASE_STORE_PASS")
def releaseKeyPass = System.getenv("MP3_RELEASE_KEY_PASS")
def hasReleaseSigning = releaseKeystorePath && releaseKeyAlias && releaseStorePass && releaseKeyPass

if (hasReleaseSigning && !file(releaseKeystorePath).isFile()) {
    throw new GradleException("Release keystore was not found: ${releaseKeystorePath}")
}

gradle.taskGraph.whenReady { graph ->
    boolean releaseRequested = graph.allTasks.any { task ->
        task.name.toLowerCase().contains("release")
    }
    if (releaseRequested && !hasReleaseSigning) {
        throw new GradleException("Release signing credentials are missing")
    }
}

android {
    namespace "com.dumuzeyn.mp3player"
    compileSdk 36
    ndkVersion "27.2.12479018"
    externalNativeBuild {
        cmake { path file("src/main/cpp/CMakeLists.txt"); version "3.22.1" }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId "com.dumuzeyn.mp3player"
        minSdk 23
        targetSdk 35
        versionCode 60
        versionName "4.3.4"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk { abiFilters "arm64-v8a", "armeabi-v7a", "x86_64" }
        externalNativeBuild { cmake { arguments "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON" } }
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseKeystorePath)
                keyAlias releaseKeyAlias
                storePassword releaseStorePass
                keyPassword releaseKeyPass
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            signingConfig signingConfigs.debug
        }

        release {
            minifyEnabled true
            shrinkResources true
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }

        benchmark {
            initWith release
            applicationIdSuffix ".benchmark"
            signingConfig signingConfigs.debug
            matchingFallbacks = ["release"]
            debuggable false
        }
    }
}

def audioLicenses = tasks.register("prepareAudioLicenses", Sync) {
    from(rootProject.file("third_party/rnnoise/COPYING")) { rename { "RNNoise.txt" } }
    from(rootProject.file("third_party/demucs/LICENSE")) { rename { "demucs.cpp.txt" } }
    from(rootProject.file("third_party/LAME-COPYING")) { rename { "LAME.txt" } }
    from(rootProject.file("third_party/demucs/vendor/eigen")) { include "COPYING.*"; into "Eigen" }
    from({ configurations.debugRuntimeClasspath.findAll { it.name.startsWith("commons-math3-") }
            .collect { zipTree(it) } }) {
        include "META-INF/LICENSE.txt", "META-INF/NOTICE.txt"
        into "CommonsMath"
    }
    into(layout.buildDirectory.dir("generated/audioLicenses/licenses"))
}
android.sourceSets.main.assets.srcDir(layout.buildDirectory.dir("generated/audioLicenses"))
tasks.named("preBuild").configure { dependsOn audioLicenses }

dependencies {
    def media3Version = "1.10.1"

    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.11.0"
    implementation "androidx.media3:media3-exoplayer:$media3Version"
    implementation "androidx.media3:media3-session:$media3Version"
    implementation "androidx.media3:media3-transformer:$media3Version"
    implementation "com.github.wendykierp:JTransforms:3.1"
    implementation "androidx.recyclerview:recyclerview:1.4.0"
    implementation "androidx.viewpager2:viewpager2:1.1.0"
    implementation "androidx.profileinstaller:profileinstaller:1.4.1"
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20260719"
    androidTestImplementation "androidx.test:core:1.6.1"
    androidTestImplementation "androidx.test:runner:1.6.2"
    androidTestImplementation "androidx.test.ext:junit:1.2.1"
}

tasks.register("printVersionName") {
    doLast {
        println android.defaultConfig.versionName
    }
}

tasks.register("checkLauncherIcon") {
    group = "verification"
    description = "Checks launcher icon resolution, transparency, safe zone, and surfaces."
    doLast {
        def masterFile = file("src/main/res/drawable-nodpi/voltune_icon_master.png")
        def foregroundFile = file("src/main/res/drawable-nodpi/voltune_icon_foreground.png")
        def master = javax.imageio.ImageIO.read(masterFile)
        def foreground = javax.imageio.ImageIO.read(foregroundFile)
        if (master == null || foreground == null) {
            throw new GradleException("Voltune launcher icon PNG could not be decoded")
        }
        if (master.width != master.height || master.width < 1024) {
            throw new GradleException("Launcher master must be square and at least 1024 px")
        }
        if (!foreground.colorModel.hasAlpha()) {
            throw new GradleException("Adaptive foreground must contain transparency")
        }
        int minX = foreground.width
        int maxX = -1
        for (int y = 0; y < foreground.height; y++) {
            for (int x = 0; x < foreground.width; x++) {
                if (((foreground.getRGB(x, y) >>> 24) & 0xff) > 8) {
                    minX = Math.min(minX, x)
                    maxX = Math.max(maxX, x)
                }
            }
        }
        double effectiveWidth = (maxX - minX + 1d) / foreground.width
        if (effectiveWidth < 0.78d || effectiveWidth > 0.88d) {
            throw new GradleException("Adaptive icon safe-zone width is ${effectiveWidth}")
        }
        def manifestText = file("src/main/AndroidManifest.xml").getText("UTF-8")
        def colorsText = file("src/main/res/values/colors.xml").getText("UTF-8")
        def fallbackStyleText = file("src/main/res/values/styles.xml").getText("UTF-8")
        def styleText = file("src/main/res/values-v31/styles.xml").getText("UTF-8")
        def palettes = ['blue', 'red', 'green', 'pink', 'orange']
        def launcherIcons = [
                'ic_launcher_home': 'voltune_icon_foreground_layer',
                'ic_launcher_dark': 'voltune_icon_foreground_layer'
        ]
        def launcherBackgrounds = [
                'ic_launcher_home': 'launcher_icon_transparent',
                'ic_launcher_dark': 'launcher_icon_transparent'
        ]
        palettes.each { background ->
            ['light', 'dark'].each { mode ->
                palettes.each { foregroundPalette ->
                    def icon = "ic_launcher_custom_${background}_${mode}"
                    if (foregroundPalette != background) {
                        icon += "_foreground_${foregroundPalette}"
                    }
                    launcherIcons[icon] = "voltune_icon_foreground_${foregroundPalette}_layer"
                    launcherBackgrounds[icon] = 'launcher_icon_transparent'
                }
            }
        }
        launcherIcons.each { icon, foregroundName ->
            if (!manifestText.contains("@mipmap/${icon}")) {
                throw new GradleException("Launcher alias is not mapped to ${icon}")
            }
            def adaptive = file("src/main/res/mipmap-anydpi-v26/${icon}.xml").getText("UTF-8")
            if (!adaptive.contains("@drawable/${foregroundName}")) {
                throw new GradleException("${icon} does not use its Voltune palette artwork")
            }
            if (!adaptive.contains("@color/${launcherBackgrounds[icon]}")) {
                throw new GradleException("${icon} uses the wrong semantic background")
            }
            def themed = file("src/main/res/mipmap-anydpi-v33/${icon}.xml").getText("UTF-8")
            if (!themed.contains("@drawable/${foregroundName}")) {
                throw new GradleException("${icon} themed icon uses the wrong palette")
            }
            if (!themed.contains("@color/${launcherBackgrounds[icon]}")) {
                throw new GradleException("${icon} themed icon uses the wrong background")
            }
            def hasMonochrome = themed.contains('<monochrome android:drawable="@drawable/voltune_icon_monochrome"')
            if (icon.startsWith('ic_launcher_custom_') ? hasMonochrome : !hasMonochrome) {
                throw new GradleException("${icon} has the wrong Android 13 themed icon mode")
            }
            if (icon.startsWith('ic_launcher_custom_')) {
                def parts = icon.split('_')
                def foregroundPalette = parts.length > 5 ? parts[6] : parts[3]
                def legacyName = "voltune_icon_legacy_${parts[3]}_${parts[4]}"
                if (foregroundPalette != parts[3]) {
                    legacyName += "_foreground_${foregroundPalette}"
                }
                def legacy = file("src/main/res/mipmap-anydpi/${icon}.xml").getText("UTF-8")
                if (!legacy.contains("@drawable/${legacyName}")) {
                    throw new GradleException("${icon} legacy icon uses the wrong palette")
                }
            } else {
                def mode = icon == 'ic_launcher_home' ? 'light' : 'dark'
                def legacy = file("src/main/res/mipmap-anydpi/${icon}.xml").getText("UTF-8")
                if (!legacy.contains("@drawable/voltune_icon_legacy_${mode}")) {
                    throw new GradleException("${icon} legacy icon uses a stale background")
                }
            }
        }
        if (!colorsText.contains('<color name="voltune_background_light">#FFFFFF</color>')
                || !colorsText.contains('<color name="voltune_background_dark">#111015</color>')) {
            throw new GradleException("Canonical Light/Dark backgrounds changed unexpectedly")
        }
        def lightLegacy = javax.imageio.ImageIO.read(
                file("src/main/res/drawable-nodpi/voltune_icon_legacy_light.png"))
        def darkLegacy = javax.imageio.ImageIO.read(
                file("src/main/res/drawable-nodpi/voltune_icon_legacy_dark.png"))
        if (Integer.toUnsignedLong(lightLegacy.getRGB(lightLegacy.width.intdiv(2), 8))
                != 0xffffffffL
                || Integer.toUnsignedLong(darkLegacy.getRGB(darkLegacy.width.intdiv(2), 8))
                != 0xff111015L) {
            throw new GradleException("Legacy Light/Dark PNG backgrounds are not canonical")
        }
        ['v26', 'v33'].each { api ->
            def defaultIcon = file("src/main/res/mipmap-anydpi-${api}/ic_launcher_voltune.xml")
                    .getText("UTF-8")
            if (!defaultIcon.contains('@color/launcher_icon_transparent')) {
                throw new GradleException("Default ${api} application icon uses a stale background")
            }
        }
        if (!file("src/main/res/mipmap-anydpi/ic_launcher_voltune.xml").getText("UTF-8")
                .contains('@drawable/voltune_icon_legacy_dark')) {
            throw new GradleException("Default legacy application icon uses a stale background")
        }
        [fallbackStyleText, styleText].each { text ->
            ['statusBarColor', 'navigationBarColor', 'windowBackground'].each { attribute ->
                if (!text.contains("<item name=\"android:${attribute}\">@color/voltune_background_light</item>")
                        || !text.contains("<item name=\"android:${attribute}\">@color/voltune_background_dark</item>")) {
                    throw new GradleException("${attribute} is not tied to canonical backgrounds")
                }
            }
        }
        if (!styleText.contains('<item name="android:windowSplashScreenBackground">@color/voltune_background_light</item>')
                || !styleText.contains('<item name="android:windowSplashScreenBackground">@color/voltune_background_dark</item>')) {
            throw new GradleException("Android 12 splash is not tied to canonical backgrounds")
        }
        palettes.each { palette ->
            def paletteFile = file("src/main/res/drawable-nodpi/voltune_icon_foreground_${palette}.png")
            def paletteImage = javax.imageio.ImageIO.read(paletteFile)
            if (paletteImage == null || paletteImage.width != foreground.width
                    || paletteImage.height != foreground.height || !paletteImage.colorModel.hasAlpha()) {
                throw new GradleException("${palette} launcher palette is missing or malformed")
            }
            int paletteMinX = paletteImage.width
            int paletteMaxX = -1
            for (int y = 0; y < paletteImage.height; y++) {
                for (int x = 0; x < paletteImage.width; x++) {
                    if (((paletteImage.getRGB(x, y) >>> 24) & 0xff) > 8) {
                        paletteMinX = Math.min(paletteMinX, x)
                        paletteMaxX = Math.max(paletteMaxX, x)
                    }
                }
            }
            double paletteWidth = (paletteMaxX - paletteMinX + 1d) / paletteImage.width
            if (paletteWidth < 0.78d || paletteWidth > 0.88d) {
                throw new GradleException("${palette} adaptive icon safe-zone width is ${paletteWidth}")
            }
            if (styleText.count("@drawable/voltune_icon_splash_${palette}") != 10) {
                throw new GradleException("${palette} splash does not match every background")
            }
        }
        if (styleText.count('@drawable/voltune_splash_icon') != 2
                || styleText.count('windowSplashScreenBackground') != 52
                || launcherIcons.size() != 52
                || manifestText.count('<activity-alias') != 52) {
            throw new GradleException("Every launch theme must define a themed splash")
        }
        println "Launcher icon PASS: ${master.width}px master, safe-zone width ${String.format('%.3f', effectiveWidth)}"
    }
}

tasks.register("checkSourceFileSize") {
    group = "verification"
    description = "Fails when a production Java or Kotlin source exceeds 600 lines."
    doLast {
        int limit = 600
        def oversized = []
        fileTree("src/main") {
            include "**/*.java", "**/*.kt"
            exclude "**/build/**", "**/generated/**"
        }.files.sort().each { source ->
            int lines = source.readLines("UTF-8").size()
            if (lines > limit) {
                oversized << "File: ${source}\nLines: ${lines}\nLimit: ${limit}"
            }
        }
        if (!oversized.isEmpty()) {
            throw new GradleException(oversized.join("\n\n"))
        }
        println "Source file size PASS: every production source is <= ${limit} lines"
    }
}

tasks.register("checkArchitecture") {
    group = "verification"
    description = "Checks critical playback and local-only architecture invariants."
    doLast {
        def sources = fileTree("src/main") { include "**/*.java", "**/*.kt" }
        def sourceText = { String baseName ->
            def matches = sources.files.findAll { source ->
                source.name == "${baseName}.java" || source.name == "${baseName}.kt"
            }
            if (matches.size() != 1) {
                throw new GradleException(
                        "Expected one ${baseName} source; found ${matches.size()}")
            }
            matches.first().getText("UTF-8")
        }
        int playerCreations = sources.files.sum { source ->
            source.getText("UTF-8").count("ExoPlayer.Builder(")
        } as int
        if (playerCreations != 1) {
            throw new GradleException("Expected exactly one ExoPlayer construction; found ${playerCreations}")
        }
        def core = sourceText("MainActivityCore")
        for (String forbidden : ["SQLiteDatabase", "ExoPlayer", "MediaMetadataRetriever"]) {
            if (core.contains(forbidden)) {
                throw new GradleException("MainActivityCore owns forbidden responsibility: ${forbidden}")
            }
        }
        def playbackService = sourceText("Media3PlayerService")
        if (playbackService.contains("TrackStore.load(")) {
            throw new GradleException(
                    "Media3PlayerService must not read the full library on its main thread")
        }
        if (playbackService.count("TrackStore.updateDuration(") != 1
                || !playbackService.contains("launch(Dispatchers.IO)")) {
            throw new GradleException(
                    "Media3PlayerService must write duration through Dispatchers.IO")
        }
        def manifest = file("src/main/AndroidManifest.xml").getText("UTF-8")
        for (String permission : ["android.permission.INTERNET",
                "android.permission.MANAGE_EXTERNAL_STORAGE"]) {
            if (manifest.contains(permission)) {
                throw new GradleException("Local-only manifest contains forbidden permission: ${permission}")
            }
        }
        println "Architecture PASS: one player, separated core, local-only permissions"
    }
}

tasks.register("qualityCheck") {
    group = "verification"
    description = "Runs Voltune's complete pre-commit quality gate."
    dependsOn "checkSourceFileSize", "checkArchitecture", "checkLauncherIcon",
            "testDebugUnitTest", "lintDebug", "assembleDebug",
            "assembleDebugAndroidTest"
}
